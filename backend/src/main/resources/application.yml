server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/connectamong?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Anish@MySQL1
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: "change-this-to-a-very-long-random-secret-64+chars-minimum-length-required-for-security"
    expirationMinutes: 120
  domains:
    - STUDENT
    - TEACHER
    - DEVELOPER
    - DESIGNER
    - DATA_SCIENTIST
    - PRODUCT
    - MARKETING

cors:
  allowedOrigins:
    - "http://localhost:5173"
    - "http://localhost:3000"
